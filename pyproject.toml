[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dircurv"
version = "0.2.0"
description = "Directional curvature measurement under restricted sampling, with reliability reporting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ramakrishna Pasupuleti", email = "workisfun415@gmail.com"}]
keywords = ["numerical-differentiation", "hessian", "conditioning",
            "derivative-free-optimization", "elastography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
paper = ["matplotlib>=3.6", "sympy>=1.12", "scipy>=1.9"]
dev = ["pytest>=7", "matplotlib>=3.6", "sympy>=1.12", "scipy>=1.9"]

[project.urls]
Homepage = "https://github.com/workisfun415/directional-curvature"
Archive = "https://doi.org/10.5281/zenodo.21793101"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
